# Tiamat Weather — rain, snow, storms and the ground they leave behind.
#
# A standalone mod that sits beside the Spindle (tiamat_default_world) rather
# than inside it. See ../../docs/weather-plan.md for the design and the numbers.
#
# The Spindle is an OPTIONAL dependency, pinned below 0.2: its humidity field
# is mirrored in climate_spindle.lua, and a Spindle that has moved on is
# refused here rather than silently disagreed with. Life is optional too:
# naming it is what lets fire.lua call the unlocks Life exports
# (`add_contact_fire`, `add_heat_source`, `set_alight`), so fire hurts and
# lightning sets whoever it strikes alight. The engine refuses a cycle, so
# Life cannot name Weather back (docs/exports-contract.md).
id = "tiamat_weather"
name = "Tiamat Weather"
version = "0.1.0"
depends = ["core >=0.1"]
optional_depends = ["tiamat_default_world >=0.1, <0.2", "tiamat_default_life >=0.1"]
description = "Rain, snow, storms and the ground they leave behind."
license = "MIT"

# Chosen on the new-world screen and fixed for the life of the world: fire is
# world state, so it is a world option and not a player setting.
[[world_option]]
id = "fires"
name = "Wildfires"
description = "Lightning and lava can set trees and grass alight. Fires are small, burn out on their own, and rain puts them out."
default = 1
