# Tiamot Weather — rain, snow, storms and the ground they leave behind.
#
# A standalone mod that sits beside the Spindle (tiamot_default_world) rather
# than inside it. See ../../docs/weather-plan.md for the design and the numbers.
#
# The Spindle is an OPTIONAL dependency, pinned below 0.2: its humidity field
# is mirrored in climate_spindle.lua, and a Spindle that has moved on is
# refused here rather than silently disagreed with.
id = "tiamot_weather"
name = "Tiamot Weather"
version = "0.1.0"
depends = ["core >=0.1"]
optional_depends = ["tiamot_default_world >=0.1, <0.2"]
description = "Rain, snow, storms and the ground they leave behind."
license = "MIT"
